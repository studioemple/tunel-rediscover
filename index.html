<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rediscover tunel – finalni raspored panela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=Sora:wght@700&display=swap" rel="stylesheet">
<style>
/* Final layout, read-only: a narrow settings column (panel size, floor stickers) beside the floor plan.
   Hovering a panel shows its artwork. Rentlio colours on a dark Prussian ground. */
:root{
  --bg:#0A2239; --surface:#0F3152; --surface-2:#15406A; --line:rgba(214,230,245,.14);
  --text:#EAF2F8; --muted:#93AECA; --accent:#009FE3; --accent-2:#59C8E7; --panel:#A8CE3A;
  --wall:#DCE6EE; --bad:#FF6B6B;
  --display:'Barlow',system-ui,sans-serif; --cond:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--display);font-size:15px;line-height:1.45}
input{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;font-weight:700}
header p{margin:0;color:var(--muted);font-size:14px}
.app{display:grid;grid-template-columns:290px 1fr;min-height:calc(100% - 56px)}
aside{padding:16px 18px;display:flex;flex-direction:column;gap:20px;border-right:1px solid var(--line);overflow:auto}
section h2{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 84px;align-items:center;gap:8px;margin:6px 0}
.row label{color:var(--muted);font-size:14px}
.row input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0;cursor:pointer}
.check input{accent-color:var(--accent)}
input:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--surface);border-radius:10px;padding:8px 10px}
.fact b{display:block;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.warn{color:var(--bad)}
.plan-wrap{position:relative;padding:12px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
details>summary{list-style:none;cursor:pointer;margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'+';font-size:16px;letter-spacing:0}
details[open]>summary::after{content:'–'}
.dimnote{font-size:13px;color:var(--muted);max-width:820px;text-align:center;margin:0}
#plan{width:100%;max-width:820px;height:calc(100vh - 150px);min-height:560px;touch-action:manipulation}
svg text{font-family:var(--cond)}
.pnl{cursor:pointer}
.pnl:focus{outline:none}
.pnl:focus-visible circle{stroke:#fff;stroke-width:.05}
#pop.sheet{left:50%!important;top:auto!important;bottom:12px;transform:translateX(-50%);width:min(340px,calc(100vw - 24px));pointer-events:auto;display:grid;grid-template-columns:42% 1fr;align-items:end}
#pop.sheet:not(.on){transform:translate(-50%,8px)}
#pop.sheet.on{transform:translateX(-50%)}
#pop.sheet img{height:100%;max-height:46vh}
#pop{position:fixed;z-index:10;pointer-events:none;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.45);overflow:hidden;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#pop.on{opacity:1;transform:none}
#pop.sheet.on{transform:translateX(-50%)}
#pop img{display:block;width:100%;aspect-ratio:2835/5103;object-fit:cover;background:#111}
#pop div{padding:8px 11px 10px;font-size:13px}
#pop b{font-size:14px}
#pop span{color:var(--muted)}
@media (max-width:760px){
  header{padding:12px 14px}header h1{font-size:17px}header p{font-size:13px}
  .app{grid-template-columns:1fr;min-height:0}
  .plan-wrap{order:-1;padding:10px 8px}
  aside{border-right:0;border-top:1px solid var(--line);padding:14px 16px 90px}
  #plan{height:auto;min-height:0;aspect-ratio:9.6/15.6}
  .row input{font-size:16px}
}
@media (prefers-reduced-motion:reduce){#pop{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Rediscover tunel · finalni raspored panela</h1>
  <p>20 panela. Prijeđite mišem ili dodirnite panel za pregled.</p>
</header>
<div class="app">
<aside>
  <details open class="sec">
    <summary>Panel</summary>
    <div class="row"><label for="pw">Širina (cm)</label><input id="pw" type="number" min="40" max="200" step="5"></div>
    <div class="row"><label for="ph">Visina (cm)</label><input id="ph" type="number" min="60" max="300" step="5"></div>
    <div class="facts" id="pfacts"></div>
    <p class="note" id="pnote"></p>
  </details>
  <details open class="sec">
    <summary>Naljepnice za pod</summary>
    <label class="check"><input type="checkbox" id="fOn">Godine i linije po sredini poda</label>
    <div class="row"><label for="fY0">Od godine</label><input id="fY0" type="number" min="1990" max="2040"></div>
    <div class="row"><label for="fY1">Do godine</label><input id="fY1" type="number" min="1990" max="2040"></div>
    <div class="row"><label for="fSw">Godina: širina (cm)</label><input id="fSw" type="number" min="20" max="250" step="5"></div>
    <div class="row"><label for="fSd">Godina: dubina (cm)</label><input id="fSd" type="number" min="10" max="120" step="5"></div>
    <div class="row"><label for="fDw">Linija: širina (cm)</label><input id="fDw" type="number" min="1" max="20" step="0.5"></div>
    <div class="row"><label for="fPad">Linija od godine (cm)</label><input id="fPad" type="number" min="0" max="200" step="5"></div>
    <div class="row"><label for="fStart">Prva godina od ulaza (m)</label><input id="fStart" type="number" min="0" max="10" step="0.1"></div>
    <div class="row"><label for="fEnd">Zadnja godina do izlaza (m)</label><input id="fEnd" type="number" min="0" max="10" step="0.1"></div>
    <div class="row"><label for="fCorner">Godina od skretanja (m)</label><input id="fCorner" type="number" min="0" max="3" step="0.1"></div>
    <label class="check"><input type="checkbox" id="fExt">Linija i prije prve i poslije zadnje godine</label>
    <div class="facts" id="ffacts" style="margin-top:8px"></div>
  </details>
  <details open class="sec">
    <summary>Tunel</summary>
    <div class="facts" id="tfacts"></div>
    <p class="note">Kote su s tlocrta; one sa ≈ izmjerene su s crteža, ±10 cm. Prije narudžbe provjeriti na licu mjesta.</p>
  </details>
</aside>
<div class="plan-wrap">
  <div class="seg" role="group" aria-label="Prikaz">
    <button type="button" id="vPanels" aria-pressed="true">Paneli i naljepnice</button>
    <button type="button" id="vDims" aria-pressed="false">Dimenzije tunela</button>
  </div>
  <svg id="plan" viewBox="-1.0 -0.4 9.6 15.6" aria-label="Tlocrt tunela s 20 panela"></svg></div>
</div>
<div id="pop" aria-hidden="true"><img alt=""><div><b></b><br><span></span></div></div>

<script>
const IMG = {"1": "panels/1.jpg", "2": "panels/2.jpg", "3": "panels/3.jpg", "4": "panels/4.jpg", "5": "panels/5.jpg", "6": "panels/6.jpg", "7": "panels/7.jpg", "8": "panels/8.jpg", "9": "panels/9.jpg", "10": "panels/10.jpg", "11": "panels/11.jpg", "12": "panels/12.jpg", "13": "panels/13.jpg", "14": "panels/14.jpg", "15": "panels/15.jpg", "16": "panels/16.jpg", "17": "panels/17.jpg", "18": "panels/18.jpg", "19": "panels/19.jpg", "20": "panels/20.jpg"};
// ---------- tunnel geometry in metres (from the floor plan, ±10 cm)
const WALL_A=[[2.14,14.19],[7.76,14.19],[7.76,0],[2.27,0],[2.27,9.27],[0,9.27]];
const WALL_B=[[0,14.19],[0,11.85],[4.92,11.85],[4.92,2.60]];
const FLOOR=[[0,14.19],[7.76,14.19],[7.76,0],[2.27,0],[2.27,9.27],[0,9.27],[0,11.80],[4.87,11.80],[4.87,2.60],[4.97,2.60],[4.97,11.90],[0,11.90]];
const FACES={
  F1:{name:'Donji hodnik · unutarnji zid', a:[0.05,11.90], b:[4.97,11.90], n:[0,1]},
  F2:{name:'Donji hodnik · vanjski zid',   a:[2.14,14.14], b:[7.71,14.14], n:[0,-1]},
  F3:{name:'Desni hodnik · unutarnji zid', a:[4.97,11.90], b:[4.97,2.60],  n:[1,0]},
  F4:{name:'Desni hodnik · vanjski zid',   a:[7.71,14.14], b:[7.71,0.05],  n:[-1,0]},
  F5:{name:'Gornji prolaz · vanjski zid',  a:[7.71,0.05],  b:[2.32,0.05],  n:[0,1]},
  F6:{name:'Lijevi hodnik · unutarnji zid',a:[4.87,2.60],  b:[4.87,11.80], n:[-1,0]},
  F7:{name:'Lijevi hodnik · vanjski zid',  a:[2.32,0.05],  b:[2.32,9.32],  n:[1,0]},
  F8:{name:'Izlaz · unutarnji zid',        a:[4.87,11.80], b:[0.05,11.80], n:[0,-1]},
};
// ---------- final panel positions (t = centre of the panel, metres from the start of its wall)
const PANELS=[
  {n:1, face:'F1',t:1.30,year:'2014',title:'Back to Zadar. Rentlio begins.'},
  {n:2, face:'F1',t:3.51,year:'2014',title:'Marko and Ivan join the forces.'},
  {n:3, face:'F2',t:3.31,year:'2015',title:'First app. First recognition.'},
  {n:4, face:'F3',t:1.12,year:'2016',title:'Small team. Bigger ambitions.'},
  {n:5, face:'F4',t:4.52,year:'2017',title:'Rentlio opens its doors to other apps.'},
  {n:6, face:'F3',t:3.44,year:'2018',title:'From Zadar to the Booking.com stage'},
  {n:7, face:'F4',t:6.84,year:'2018',title:'Booking.com tries to buy Rentlio'},
  {n:8, face:'F3',t:5.77,year:'2019',title:'First teambuilding in Lika'},
  {n:9, face:'F4',t:9.17,year:'2019',title:'First hotel customers beyond Croatia'},
  {n:10,face:'F3',t:8.09,year:'2020',title:'Keep building even when it’s hardest. · New mobile app'},
  {n:11,face:'F4',t:11.83,year:'2020',title:'Keep building even when it’s hardest. · New Booking Engine & Channel Manager'},
  {n:12,face:'F5',t:3.24,year:'2021',title:'Five new positions open. The team approaches twenty people.'},
  {n:13,face:'F7',t:2.76,year:'2022',title:'Infinum Ventures invests in Rentlio'},
  {n:14,face:'F6',t:1.21,year:'2022',title:'Rentlio Pro launches as a separate product built for hotels.'},
  {n:15,face:'F7',t:4.86,year:'2022',title:'The first Rentlio Rediscover brings together around a hundred hoteliers'},
  {n:16,face:'F6',t:3.40,year:'2023',title:'The second Rediscover bringing more than 250 attendees'},
  {n:17,face:'F7',t:7.02,year:'2024',title:'Three segments. A clearer offer.'},
  {n:18,face:'F6',t:5.58,year:'2024',title:'Ten years of Rentlio and 4 awards in a survey of the best employers'},
  {n:19,face:'F6',t:7.77,year:'2025',title:'The fourth Rediscover: more than 330 attendees, seven programme sessions and workshops'},
  {n:20,face:'F8',t:3.19,year:'2025',title:'Rentlio joins the Travelnode group'},
];
// ---------- helpers
const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]], add=(p,q)=>[p[0]+q[0],p[1]+q[1]], mul=(p,k)=>[p[0]*k,p[1]*k];
const len=p=>Math.hypot(p[0],p[1]), $=id=>document.getElementById(id);
const fmt=x=>(Math.round(x*100)/100).toFixed(2).replace('.',','), fmt1=x=>(Math.round(x*10)/10+'').replace('.',',');
Object.values(FACES).forEach(f=>{ f.L=len(sub(f.b,f.a)); f.e=mul(sub(f.b,f.a),1/f.L); });
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs={},parent)=>{ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; };

// ---------- settings (only these are editable)
const FLOOR_DEFAULT={on:true,y0:2014,y1:2026,sw:100,sd:35,dw:3,pad:30,start:2.5,end:1.8,corner:1.0,ext:true};
let S={w:100,h:180,view:'panels',floor:{...FLOOR_DEFAULT}};
try{ const s=JSON.parse(localStorage.getItem('rediscover-tunel-final-v1')||'null'); if(s){ S={...S,...s,floor:{...FLOOR_DEFAULT,...(s.floor||{})}}; } }catch(e){}
const save=()=>{ try{ localStorage.setItem('rediscover-tunel-final-v1',JSON.stringify(S)); }catch(e){} };

// ---------- floor stickers along the centre line
const FLOORPATH=[[1.07,14.19],[1.07,13.02],[6.34,13.02],[6.34,1.30],[3.60,1.30],[3.60,10.56],[0,10.56]];
function floorLayout(){
  const F=S.floor, segs=[]; let acc=0;
  for(let i=0;i<FLOORPATH.length-1;i++){ const a=FLOORPATH[i],b=FLOORPATH[i+1],L=len(sub(b,a)); segs.push({a,L,acc,e:mul(sub(b,a),1/L)}); acc+=L; }
  const T=acc, verts=segs.slice(1).map(g=>g.acc);
  const at=s=>{ s=Math.max(0,Math.min(T,s)); const g=segs.find(g=>s<=g.acc+g.L+1e-9)||segs.at(-1); return {p:add(g.a,mul(g.e,s-g.acc)),e:g.e}; };
  const n=Math.max(0,F.y1-F.y0+1), sd=F.sd/100, pad=F.pad/100, a=F.start, b=T-F.end, years=[], lines=[];
  for(let i=0;i<n;i++){ let s=n===1?(a+b)/2:a+i*(b-a)/(n-1); for(const v of verts) if(Math.abs(s-v)<F.corner) s=v+(s>=v?1:-1)*F.corner; years.push({year:F.y0+i,s}); }
  years.sort((x,y)=>x.s-y.s);
  const fill=(u,v)=>{ if(v-u<0.05) return; const cuts=[u,...verts.filter(x=>x>u&&x<v),v]; for(let i=0;i<cuts.length-1;i++) lines.push({s0:cuts[i],s1:cuts[i+1]}); };
  if(F.ext&&n) fill(0.3,years[0].s-sd/2-pad);
  for(let i=0;i<years.length-1;i++) fill(years[i].s+sd/2+pad,years[i+1].s-sd/2-pad);
  if(F.ext&&n) fill(years.at(-1).s+sd/2+pad,T-0.3);
  const gaps=years.slice(1).map((y,i)=>y.s-years[i].s);
  return {T,at,years,lines,gaps};
}

// ---------- drawing
const plan=$('plan'), pop=$('pop');
function draw(){
  plan.innerHTML='';
  const W=S.w/100;
  el('polygon',{points:FLOOR.map(p=>p.join(',')).join(' '),fill:'rgba(0,159,227,.08)'},plan);
  el('rect',{x:0.04,y:2.52,width:2.02,height:5.02,fill:'#6B6B1E',opacity:'.35',rx:'0.03'},plan);
  const dims=S.view==='dims';
  // floor stickers
  if(S.floor.on&&!dims){ const FL=floorLayout(), F=S.floor, sw=F.sw/100, sd=F.sd/100, dv=Math.max(F.dw/100,0.03), g=el('g',{},plan);
    FL.lines.forEach(d=>{ const A=FL.at(d.s0+1e-6), B=FL.at(d.s1-1e-6), e=A.e, r=[-e[1],e[0]], a0=add(A.p,mul(e,-dv/2)), b0=add(B.p,mul(e,dv/2));
      el('polygon',{points:[add(a0,mul(r,-dv/2)),add(b0,mul(r,-dv/2)),add(b0,mul(r,dv/2)),add(a0,mul(r,dv/2))].map(q=>q.join(',')).join(' '),fill:'#fff',opacity:'.9'},g); });
    FL.years.forEach(y=>{ const A=FL.at(y.s), r=[-A.e[1],A.e[0]], deg=Math.atan2(r[1],r[0])*180/Math.PI, gg=el('g',{transform:`translate(${A.p[0]} ${A.p[1]}) rotate(${deg})`},g);
      el('rect',{x:-sw/2,y:-sd/2,width:sw,height:sd,fill:'rgba(255,255,255,.05)',stroke:'rgba(255,255,255,.4)','stroke-width':'0.01','stroke-dasharray':'0.04 0.03'},gg);
      const fs=Math.min(sd*0.8/0.73,sw*0.9/2.85); const t=el('text',{x:0,y:fs*0.365,'text-anchor':'middle','font-size':fs,'font-weight':'700',fill:'#fff',style:"font-family:'Sora',sans-serif"},gg); t.textContent=y.year; }); }
  // walls
  [WALL_A,WALL_B].forEach(w=>el('polyline',{points:w.map(p=>p.join(',')).join(' '),fill:'none',stroke:'#DCE6EE','stroke-width':'0.10'},plan));
  // entrance / exit
  const lab=(x,y,t)=>{ const e=el('text',{x,y,'text-anchor':'middle','font-size':'0.28','font-weight':'600',fill:'#59C8E7'},plan); e.textContent=t; };
  lab(1.07,15.08,'ULAZ ↑'); lab(-0.55,10.1,'← IZLAZ');
  if(dims) drawDims();
  // panels
  const clash=new Set();
  PANELS.forEach(p=>PANELS.forEach(q=>{ if(p!==q&&p.face===q.face&&Math.abs(p.t-q.t)<W-1e-6) clash.add(p.n); }));
  if(!dims) PANELS.forEach(p=>{
    const f=FACES[p.face], c=add(f.a,mul(f.e,p.t)), h=W/2, col=clash.has(p.n)?'#FF6B6B':'#A8CE3A';
    const A=add(add(c,mul(f.e,-h)),mul(f.n,0.06)), B=add(add(c,mul(f.e,h)),mul(f.n,0.06));
    const g=el('g',{class:'pnl',tabindex:'0',role:'button','aria-label':`Panel ${p.n}, ${p.year}: ${p.title}`},plan);
    el('polygon',{points:[A,B,add(B,mul(f.n,0.09)),add(A,mul(f.n,0.09))].map(q=>q.join(',')).join(' '),fill:col},g);
    const lp=add(c,mul(f.n,0.42));
    el('circle',{cx:lp[0],cy:lp[1],r:0.2,fill:'#0F3152',stroke:col,'stroke-width':'0.025'},g);
    const t=el('text',{x:lp[0],y:lp[1]+0.075,'text-anchor':'middle','font-size':'0.21','font-weight':'600',fill:'#EAF2F8'},g); t.textContent=p.n;
    // generous invisible hit area
    el('circle',{cx:lp[0],cy:lp[1],r:0.42,fill:'transparent'},g);
    g.addEventListener('pointerenter',ev=>{ if(ev.pointerType==='mouse') show(p,ev); });
    g.addEventListener('pointermove',ev=>{ if(ev.pointerType==='mouse'&&!pop.classList.contains('sheet')) place(ev.clientX,ev.clientY); });
    g.addEventListener('pointerleave',ev=>{ if(ev.pointerType==='mouse') hide(); });
    g.addEventListener('click',ev=>{ ev.stopPropagation(); if(ev.pointerType!=='mouse'){ pop.classList.add('sheet'); show(p,ev); } }); g.addEventListener('focus',()=>{ const r=g.getBoundingClientRect(); show(p,{clientX:r.right,clientY:r.top}); }); g.addEventListener('blur',hide);
  });
  // scale bar
  const sb=el('g',{stroke:'#93AECA','stroke-width':'0.03'},plan); el('line',{x1:5.6,y1:14.85,x2:7.6,y2:14.85},sb); [5.6,6.6,7.6].forEach(x=>el('line',{x1:x,y1:14.77,x2:x,y2:14.93},sb));
  const st=el('text',{x:6.6,y:14.7,'text-anchor':'middle','font-size':'0.2',fill:'#93AECA'},plan); st.textContent='2 m';
  sidebar(clash);
}
function drawDims(){
  const g=el('g',{},plan), C='#59C8E7';
  const tick=(p,dir)=>{ const n=[-dir[1],dir[0]]; el('line',{x1:p[0]-n[0]*0.12,y1:p[1]-n[1]*0.12,x2:p[0]+n[0]*0.12,y2:p[1]+n[1]*0.12,stroke:C,'stroke-width':'0.025'},g); };
  // dimension: a → b, label at the middle (rotated along the line), approx = measured from the drawing
  const dim=(a,b,label,approx,off=0.18)=>{
    const d=sub(b,a), L=len(d), e=mul(d,1/L);
    el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C,'stroke-width':'0.02',opacity:approx?'.7':'1','stroke-dasharray':approx?'0.08 0.05':'none'},g);
    tick(a,e); tick(b,e);
    const m=mul(add(a,b),0.5); let deg=Math.atan2(e[1],e[0])*180/Math.PI; if(deg>90) deg-=180; if(deg<=-90) deg+=180;
    const n=[-Math.sin(deg*Math.PI/180),Math.cos(deg*Math.PI/180)];
    const tg=el('g',{transform:`translate(${m[0]-n[0]*off} ${m[1]-n[1]*off}) rotate(${deg})`},g);
    const txt=(approx?'≈ ':'')+label;
    el('rect',{x:-0.2-txt.length*0.075,y:-0.2,width:0.4+txt.length*0.15,height:0.3,rx:0.06,fill:'#0A2239',opacity:'.85'},tg);
    const t=el('text',{x:0,y:0.03,'text-anchor':'middle','font-size':'0.26','font-weight':'600',fill:approx?'#93AECA':'#EAF2F8'},tg); t.textContent=txt;
  };
  // from the floor plan
  dim([8.2,0],[8.2,14.19],'14,19 m',false,0.0);
  dim([0.05,14.62],[7.71,14.62],'7,63 m',false,0.0);
  dim([2.32,1.95],[7.71,1.95],'5,31 m',false);
  dim([4.97,7.0],[7.71,7.0],'2,8 m',false);
  dim([2.32,5.6],[4.87,5.6],'2,66 m',false);
  dim([3.25,11.90],[3.25,14.14],'2,06 m',false);
  dim([0.75,9.32],[0.75,11.80],'2,5 m',false);
  // measured from the drawing
  dim([0.05,13.75],[2.09,13.75],'2,1 m',true);
  dim([4.5,2.60],[4.5,11.85],'9,25 m',true);
  dim([2.7,0.05],[2.7,9.27],'9,27 m',true);
  dim([0.05,11.45],[4.87,11.45],'4,9 m',true);
  // centre line of the walk
  el('polyline',{points:FLOORPATH.map(p=>p.join(',')).join(' '),fill:'none',stroke:'rgba(168,206,58,.55)','stroke-width':'0.035','stroke-dasharray':'0.15 0.1'},g);
}
function show(p,ev){ pop.querySelector('img').src=IMG[p.n]; pop.querySelector('b').textContent=`${p.n} · ${p.year}`; pop.querySelector('span').textContent=`${p.title} — ${FACES[p.face].name}`; pop.classList.add('on'); place(ev.clientX,ev.clientY); }
function hide(){ pop.classList.remove('on'); }
document.addEventListener('click',()=>{ if(pop.classList.contains('sheet')){ hide(); setTimeout(()=>pop.classList.remove('sheet'),150); } });
function place(x,y){ if(pop.classList.contains('sheet')) return; const w=pop.offsetWidth, h=pop.offsetHeight||520, m=16; let L=x+m, T=y-h/2; if(L+w>innerWidth-8) L=x-w-m; T=Math.max(8,Math.min(innerHeight-h-8,T)); pop.style.left=L+'px'; pop.style.top=T+'px'; }

function sidebar(clash){
  const area=PANELS.length*S.w*S.h/1e4;
  $('pfacts').innerHTML=`<div class="fact"><b>${PANELS.length}</b><span>panela</span></div><div class="fact"><b>${fmt1(area)} m²</b><span>površina tiska</span></div>`;
  $('pnote').innerHTML=clash.size?`<span class="warn">Uz širinu ${S.w} cm preklapaju se paneli ${[...clash].join(', ')}.</span>`:`Grafike su 2835 × 5103 px (omjer 1 : 1,8), npr. 100 × 180 cm.`;
  { const T=floorLayout().T; $('tfacts').innerHTML=`<div class="fact"><b>14,19 × 7,63 m</b><span>vanjske mjere</span></div><div class="fact"><b>${fmt1(T)} m</b><span>put po sredini</span></div><div class="fact"><b>2,06–2,8 m</b><span>širina hodnika</span></div><div class="fact"><b>2,5 m</b><span>izlaz</span></div>`; }
  const F=S.floor;
  if(!F.on){ $('ffacts').innerHTML=''; return; }
  const FL=floorLayout(), line=FL.lines.reduce((a,l)=>a+l.s1-l.s0,0), avg=FL.gaps.length?FL.gaps.reduce((a,b)=>a+b,0)/FL.gaps.length:0;
  const digit=Math.round(Math.min(F.sd/100*0.8/0.73,F.sw/100*0.9/2.85)*73);
  $('ffacts').innerHTML=`<div class="fact"><b>${FL.years.length}</b><span>naljepnica ${F.sw}×${F.sd} cm</span></div><div class="fact"><b>${fmt(avg)} m</b><span>razmak godina</span></div><div class="fact"><b>${fmt1(line)} m</b><span>bijele linije ${String(F.dw).replace('.',',')} cm</span></div><div class="fact"><b>${digit} cm</b><span>visina brojki</span></div>`;
}

// ---------- wiring
const bind=(id,get,set)=>{ const i=$(id); i.value=get(); i.addEventListener('change',()=>{ const v=Number(i.value); if(!isFinite(v)) return; set(v); save(); draw(); }); };
bind('pw',()=>S.w,v=>S.w=v); bind('ph',()=>S.h,v=>S.h=v);
[['fY0','y0'],['fY1','y1'],['fSw','sw'],['fSd','sd'],['fDw','dw'],['fPad','pad'],['fStart','start'],['fEnd','end'],['fCorner','corner']].forEach(([id,k])=>bind(id,()=>S.floor[k],v=>S.floor[k]=v));
$('fOn').checked=S.floor.on; $('fOn').onchange=e=>{ S.floor.on=e.target.checked; save(); draw(); };
$('fExt').checked=S.floor.ext; $('fExt').onchange=e=>{ S.floor.ext=e.target.checked; save(); draw(); };
const setView=v=>{ S.view=v; $('vPanels').setAttribute('aria-pressed',v==='panels'); $('vDims').setAttribute('aria-pressed',v==='dims'); hide(); save(); draw(); };
$('vPanels').onclick=()=>setView('panels'); $('vDims').onclick=()=>setView('dims');
if(matchMedia('(max-width:760px)').matches) document.querySelectorAll('details.sec').forEach(d=>d.open=false);
setView(S.view==='dims'?'dims':'panels');
</script>
</body>
